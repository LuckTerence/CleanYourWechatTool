name: CleanYourWechatTool CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        flake8 projects/clean_wechat.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 projects/clean_wechat.py --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Type check with mypy
      run: |
        mypy projects/clean_wechat.py --ignore-missing-imports

    - name: Test with pytest
      run: |
        pytest projects/wechat-intelligence-hub/tests/ -v --cov=projects --cov-report=xml --timeout=60

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit pip-audit

    - name: Run Bandit (security linter)
      run: |
        bandit -r projects/clean_wechat.py -ll

    - name: Check vulnerabilities
      # 说明: 旧版 `safety check` 自 2.x 起要求 API key 认证，
      # 未认证会以 ExpiredTokenError (exit 64) 失败，与本项目代码无关。
      # 改用 pip-audit —— 开源免费、无需注册即可扫描依赖漏洞。
      run: |
        pip-audit -r requirements-dev.txt

  release:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 上传资产到 GitHub Release 所需（最小权限，仅此 job）
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Upload assets to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber

    # 仅当仓库配置了 PYPI_TOKEN secret 时才发布到 PyPI，否则跳过
    # 注意: GitHub Actions 不允许在 if 条件中直接引用 secrets
    # (会导致整个 workflow 解析失败)，故放入 env 后由 shell 判断。
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        if [ -n "$TWINE_PASSWORD" ]; then
          twine upload dist/*
        else
          echo "::warning::未配置 PYPI_TOKEN，已跳过 PyPI 发布"
        fi

  build-gui:
    # 打包 macOS 图形界面 (.app → .dmg) 并作为资产附到 GitHub Release
    # 双架构: macos-latest=Apple Silicon (arm64), macos-13=Intel (x86_64)
    needs: [test, security-scan]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64
    permissions:
      contents: write
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install GUI build tools
      run: |
        pip install customtkinter darkdetect send2trash pyinstaller

    - name: Build macOS .app
      run: |
        pyinstaller --noconfirm CleanYourWechatTool.spec
        test -d "dist/CleanYourWechatTool.app"

    - name: Create DMG
      # dmg 根目录内放置 .app 与指向 /Applications 的软链, 支持拖拽安装
      run: |
        APP="dist/CleanYourWechatTool.app"
        test -d "$APP"
        DMG_ROOT="dmg_stage_${{ matrix.arch }}"
        mkdir -p "$DMG_ROOT"
        cp -R "$APP" "$DMG_ROOT/"
        ln -s /Applications "$DMG_ROOT/Applications"
        DMG="CleanYourWechatTool-${{ matrix.arch }}.dmg"
        hdiutil create -volname "CleanYourWechatTool" -srcfolder "$DMG_ROOT" -ov -format UDZO "$DMG"
        ls -lh "$DMG"

    - name: Upload DMG to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.ref_name }}" "CleanYourWechatTool-${{ matrix.arch }}.dmg" --repo "${{ github.repository }}" --clobber

  build-gui-windows:
    # 打包 Windows 图形界面 (.exe → .zip 便携绿色包) 并作为资产附到 GitHub Release
    needs: [test, security-scan]
    runs-on: windows-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install GUI build tools
      run: |
        pip install customtkinter darkdetect send2trash pillow pyinstaller

    - name: Build Windows Portable App
      run: |
        pyinstaller --noconfirm CleanYourWechatTool.spec

    - name: Create ZIP Package
      shell: pwsh
      run: |
        Compress-Archive -Path "dist\CleanYourWechatTool" -DestinationPath "CleanYourWechatTool-windows-x64.zip" -Force
        Get-Item "CleanYourWechatTool-windows-x64.zip" | Select-Object Name, Length

    - name: Upload ZIP to GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.ref_name }}" "CleanYourWechatTool-windows-x64.zip" --repo "${{ github.repository }}" --clobber

