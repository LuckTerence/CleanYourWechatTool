name: CleanYourWechatTool CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        flake8 projects/clean_wechat.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 projects/clean_wechat.py --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Type check with mypy
      run: |
        mypy projects/clean_wechat.py --ignore-missing-imports

    - name: Test with pytest
      run: |
        pytest projects/wechat-intelligence-hub/tests/ -v --cov=projects --cov-report=xml --timeout=60

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit pip-audit

    - name: Run Bandit (security linter)
      run: |
        bandit -r projects/clean_wechat.py -ll

    - name: Check vulnerabilities
      # 说明: 旧版 `safety check` 自 2.x 起要求 API key 认证，
      # 未认证会以 ExpiredTokenError (exit 64) 失败，与本项目代码无关。
      # 改用 pip-audit —— 开源免费、无需注册即可扫描依赖漏洞。
      run: |
        pip-audit -r requirements-dev.txt

  release:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 上传资产到 GitHub Release 所需（最小权限，仅此 job）
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Upload assets to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber

    # 仅当仓库配置了 PYPI_TOKEN secret 时才发布到 PyPI，否则跳过
    # 注意: GitHub Actions 不允许在 if 条件中直接引用 secrets
    # (会导致整个 workflow 解析失败)，故放入 env 后由 shell 判断。
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        if [ -n "$TWINE_PASSWORD" ]; then
          twine upload dist/*
        else
          echo "::warning::未配置 PYPI_TOKEN，已跳过 PyPI 发布"
        fi

  build-gui:
    # 打包 macOS 图形界面 (.app → .dmg) 并作为资产附到 GitHub Release
    # 双架构: macos-latest=Apple Silicon (arm64), macos-13=Intel (x86_64)
    needs: [test, security-scan]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64
    permissions:
      contents: write
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install GUI build tools
      run: |
        pip install customtkinter darkdetect send2trash pillow pyinstaller

    - name: Build macOS .app
      run: |
        pyinstaller --noconfirm CleanYourWechatTool.spec
        test -d "dist/CleanYourWechatTool.app"

    - name: Create DMG
      # dmg 根目录内放置 .app 与指向 /Applications 的软链, 支持拖拽安装
      run: |
        APP="dist/CleanYourWechatTool.app"
        test -d "$APP"
        DMG_ROOT="dmg_stage_${{ matrix.arch }}"
        mkdir -p "$DMG_ROOT"
        cp -R "$APP" "$DMG_ROOT/"
        ln -s /Applications "$DMG_ROOT/Applications"
        DMG="CleanYourWechatTool-${{ matrix.arch }}.dmg"
        hdiutil create -volname "CleanYourWechatTool" -srcfolder "$DMG_ROOT" -ov -format UDZO "$DMG"
        ls -lh "$DMG"

    - name: Smoke test packaged app (产物必须能真正启动)
      # v1.0.5 的教训: 87 项测试与 15 平台矩阵全绿, 但产物缺 PIL 导致
      # 双击即崩 (ModuleNotFoundError)。测试跑源码, 不覆盖打包产物,
      # 因此必须在上传 Release 前真正运行一次产物。
      run: |
        APP="dist/CleanYourWechatTool.app"
        LOG=/tmp/app_smoke.log
        "$APP/Contents/MacOS/CleanYourWechatTool" > "$LOG" 2>&1 &
        PID=$!
        sleep 8
        ALIVE=true
        kill -0 $PID 2>/dev/null || ALIVE=false
        kill $PID 2>/dev/null || true
        echo "----- app startup log -----"
        cat "$LOG"
        echo "--------------------------"
        # 无显示环境 (runner headless) 导致的失败不算打包缺陷
        if grep -qiE "no display|couldn't connect to display" "$LOG"; then
          echo "::warning::runner 无 GUI 显示环境, 跳过启动存活断言"
          exit 0
        fi
        if [ "$ALIVE" = "false" ]; then
          echo "::error::打包产物启动即退出"
          exit 1
        fi
        if grep -qiE "无法加载 Logo 图标|Traceback|ModuleNotFoundError|ImportError" "$LOG"; then
          echo "::error::产物启动日志含导入/运行时异常或依赖缺失 (典型: 未打包 Pillow)"
          exit 1
        fi
        echo "::notice::产物冒烟通过: 启动存活 8 秒且无异常"

    - name: Upload DMG to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.ref_name }}" "CleanYourWechatTool-${{ matrix.arch }}.dmg" --repo "${{ github.repository }}" --clobber

  build-gui-windows:
    # 打包 Windows 图形界面 (.exe → .zip 便携绿色包) 并作为资产附到 GitHub Release
    needs: [test, security-scan]
    runs-on: windows-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install GUI build tools
      run: |
        pip install customtkinter darkdetect send2trash pillow pyinstaller

    - name: Build Windows Portable App
      run: |
        pyinstaller --noconfirm CleanYourWechatTool.spec

    - name: Create ZIP Package
      shell: pwsh
      run: |
        Compress-Archive -Path "dist\CleanYourWechatTool" -DestinationPath "CleanYourWechatTool-windows-x64.zip" -Force
        Get-Item "CleanYourWechatTool-windows-x64.zip" | Select-Object Name, Length

    - name: Smoke test packaged exe (产物必须能真正启动)
      # 与 macOS 同理: 测试跑源码不覆盖产物, 必须在上传前跑一次。
      # Windows runner 无交互桌面会话, GUI 进程可能因无会话立即退出,
      # 因此仅对"缺依赖/导入失败"这类打包缺陷判失败, 环境性退出降级为警告。
      shell: pwsh
      run: |
        $exe = "dist\CleanYourWechatTool\CleanYourWechatTool.exe"
        if (-not (Test-Path $exe)) { Write-Error "未找到产物: $exe"; exit 1 }
        $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Minimized
        Start-Sleep -Seconds 8
        $alive = -not $proc.HasExited
        if (-not $alive) { Write-Warning "产物已退出 (exit=$($proc.ExitCode)) — 可能仅因无桌面会话" }
        else { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
        # 关键: 产物目录必须包含 GUI 依赖资源, 缺失即判失败
        foreach ($needle in @('customtkinter', 'PIL')) {
          $found = Get-ChildItem -Path "dist\CleanYourWechatTool" -Recurse -Filter "$needle*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { Write-Error "产物缺少依赖资源: $needle (典型: 未打进包)"; exit 1 }
        }
        Write-Host "::notice::Windows 产物冒烟通过: 关键依赖资源齐备"

    - name: Upload ZIP to GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.ref_name }}" "CleanYourWechatTool-windows-x64.zip" --repo "${{ github.repository }}" --clobber

